name: Betna CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: betna-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: betna
          POSTGRES_USER: betna
          POSTGRES_PASSWORD: betna-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betna -d betna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://betna:betna-ci-password@localhost:5432/betna
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @betna/api prisma migrate deploy
      - run: pnpm test
      - run: pnpm --filter @betna/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
      - run: pnpm audit --audit-level=high
      - run: git diff --check

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --file infra/Dockerfile.api --tag betna-api:ci .
      - run: docker build --file infra/Dockerfile.web --tag betna-web:ci .
      - run: docker compose -f infra/docker-compose.yml config
